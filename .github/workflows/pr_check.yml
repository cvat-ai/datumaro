name: PR Test
on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'releases/*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# This is what will cancel the workflow concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
jobs:
  pr_test:
    if: |
      github.event.pull_request.draft == false &&
      !(startsWith(github.event.pull_request.title, '[WIP]')) &&
      !(startsWith(github.event.pull_request.title, '[Dependent]'))
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-14', 'ubuntu-24.04', 'windows-2022']
        python-version: ['3.10']
        include:
          - python-version: "3.10"
            tox-env-py: "310"
          - os: "ubuntu-24.04"
            tox-env-os: "lin"
          - os: "windows-2022"
            tox-env-os: "win"
          - os: "macos-14"
            tox-env-os: "mac"
    name: pr test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installing Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Installing python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installing dependencies
        run: |
          python -m pip install tox
      - name: Unit testing
        run: |
          tox -vvv -e tests-py${{ matrix.tox-env-py }}-${{ matrix.tox-env-os }} --develop -- tests/unit --cov --cov-report=xml
      - name: Integration testing
        run: |
          tox -vvv -e tests-py${{ matrix.tox-env-py }}-${{ matrix.tox-env-os }} -- tests/integration
      - name: Rust unit tests
        run: |
          cd rust/
          cargo test
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: ${{ matrix.os }}_Python-${{ matrix.python-version }}

  Trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install pip-tools
      - name: Freeze dependencies
        run: |
          mkdir -p .ci/base
          pip-compile -o .ci/base/requirements.txt requirements.txt
          mkdir -p .ci/dev/tests
          pip-compile -o .ci/dev/tests/requirements.txt tests/requirements.txt
      - name: Run Trivy Scan (full, csv)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          trivy-config: ".ci/trivy-csv.yaml"
          scan-type: 'fs'
          scan-ref: ".ci/"
          scanners: vuln,secret
      - name: Run Trivy Scan (prod, spdx.json)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          trivy-config: ".ci/trivy-json.yaml"
          scan-type: 'fs'
          scan-ref: ".ci/base"
      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-prod-json
          path: '${{ github.workspace }}/trivy-results-*'

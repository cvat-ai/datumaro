name: Push sync
on:
  push:
    branches:
      - 'develop'

# This is what will cancel the workflow concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-push_sync
  cancel-in-progress: true

defaults:
  run:
    shell: bash
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04']
        python-version: ['3.10']
        include:
          - python-version: "3.10"
            tox-env-py: "310"
          - os: "ubuntu-24.04"
            tox-env-os: "lin"
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installing Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Rust unit tests
        run: |
          cd rust/
          cargo test
      - name: Installing python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installing dependencies
        run: |
          python -m pip install tox
      - name: Unit testing
        run: |
          tox -vvv -e tests-py${{ matrix.tox-env-py }}-${{ matrix.tox-env-os }} --develop -- tests/unit --cov --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: ${{ matrix.os }}_Python-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

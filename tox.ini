[tox]
isolated_build = true
skip_missing_interpreters = true

[testenv]
passenv =
    USERNAME
    LOCALAPPDATA
setenv =
    MPLBACKEND=agg
deps =
    -r{toxinidir}/tests/requirements.txt
extras =
    default
    tf
    tfds


[testenv:pre-commit]
basepython = python3
deps =
    pre-commit
commands = pre-commit run --show-diff-on-failure --color=always --all-files


[testenv:build-docs]
deps =
    -r{toxinidir}/docs/requirements.txt
use_develop = true
change_dir = {toxinidir}/docs
allowlist_externals =
    make
commands =
    make clean
    make html


[testenv:bandit-scan]
deps =
    bandit
commands =
    bandit -r -c .ci/ipas_default.config {toxinidir}/ -f txt -o {toxworkdir}/bandit-report.txt


[testenv:tests-py{310,311,312}-{lin,win,mac}]
commands =
    python -m pytest -v --csv={toxworkdir}/results-{envname}.csv {posargs:tests}
